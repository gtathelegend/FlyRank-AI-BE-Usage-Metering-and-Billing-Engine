services:
  postgres:
    image: postgres:15-alpine
    container_name: flyrank_billing_postgres
    restart: always
    environment:
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
      POSTGRES_DB: flyrank_billing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_user -d flyrank_billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
